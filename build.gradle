plugins {
	id 'idea'
	id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
	id 'org.spongepowered.mixin' version '0.7.+'
	id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = "${mod_version}-${minecraft_version}"
group = "net.tigereye.${modid}" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "${modid}"

minecraft {
	mappings channel: 'parchment', version: '2023.09.03-1.20.1'
	copyIdeResources = true
	accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
	runs {
		client {
			properties 'mixin.env.remapRefMap': 'true'
			property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
			workingDirectory project.file('run_client')
			arg "-mixin.config=${modid}.mixins.json"


			// Recommended logging level for the console
			property 'forge.logging.console.level', 'debug'

			mods {
				"${modid}" {
					source sourceSets.main
				}
			}
		}

		server {
			properties 'mixin.env.remapRefMap': 'true'
			property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
			workingDirectory project.file('run_server')
			arg "-mixin.config=${modid}.mixins.json"

			property 'forge.logging.console.level', 'debug'

			mods {
				"${modid}" {
					source sourceSets.main
				}
			}
		}
	}
}

repositories {
	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
		content {
			includeGroup "mezz.jei"
		}
	}

	maven {
		name = "Curse maven"
		url = "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	mavenCentral()
}

dependencies {
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" //21
	compileOnly fg.deobf("curse.maven:architectury-forge-419699:5137938")
	compileOnly fg.deobf("curse.maven:rhino-416294:6186971")
	compileOnly fg.deobf("curse.maven:kubejs-forge-238086:5853326")
	implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.2.0"))
	implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.2.0")) {
		jarJar.ranged(it, "[0.2.0,)")
	}
}

sourceSets {
    main.resources.srcDirs += 'src/generated/resources'
}

mixin {
    add sourceSets.main, "${modid}.refmap.json"
    config "${modid}.mixins.json"
    debug.export = true
}

tasks.named('processResources', ProcessResources).configure {
	var replaceProperties = [
			minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
			forge_version       : forge_version, forge_version_range: forge_version_range,
			mod_id              : "${modid}", mod_name: "${modid}", mod_license: "MIT", mod_version: mod_version,
			mod_authors         : "examplemodsareus", mod_description: "",
	]

	inputs.properties replaceProperties

	filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
		expand replaceProperties + [project: project]
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.20.1 uses Java 17.
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}"}
	}
}
